kind = "web"
previewPath = "/"
title = "TurnoHub"
version = "1.0.0"
id = "artifacts/turnohub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26195

[services.development]
run = "pnpm --filter @workspace/turnohub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/turnohub", "run", "build" ]
publicDir = "artifacts/turnohub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26195"
BASE_PATH = "/"
